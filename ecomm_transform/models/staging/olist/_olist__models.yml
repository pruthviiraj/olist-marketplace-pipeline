version: 2

models:
  - name: stg_olist__products
    description: Cleaned Olist product catalog in the Silver layer. One row represents one product.
    columns:
      - name: product_id
        description: Unique identifier for a product.
        data_tests:
          - not_null
          - unique
      - name: product_category_name_pt
        description: Original Portuguese product category. Null when the source catalog has no category.

  - name: stg_olist__product_category_translations
    description: Cleaned Portuguese-to-english product-category mapping in the Silver layer.
    columns:
      - name: product_category_name_pt
        description: Unique Portuguese product-category mapping key.
        data_tests:
          - not_null
          - unique
      - name: product_category_name_en
        description: English translation of the Portuguese product category.

  - name: stg_olist__customers
    description: Cleaned Olist customer and delivery-location records in the Silver layer. One row represents one customer_id record.
    columns:
      - name: customer_id
        description: Unique identifier for a customer record associated with an order.
        data_tests:
          - not_null
          - unique
      
      - name: customer_unique_id
        description: Identifier for the underlying customer across multiple orders.
        data_tests:
          - not_null
        
      - name: customer_zip_code_prefix
        description: Five-character delivery ZIP code prefix, retained as text.
        data_tests:
          - not_null

      - name: customer_city
        description: Customer delivery city. 
        data_tests:
          - not_null
      
      - name: customer_state
        description: Uppercase Brazilian federative-unit code.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["AC", "AL", "AM", "AP", "BA", "CE", "DF", "ES", "GO", "MA", "MG", "MS", "MT", "PA", "PB", "PE", "PI", "PR", "RJ", "RN", "RO", "RR", "RS", "SC", "SE", "SP", "TO"]

  - name: stg_olist__sellers
    description: Seller and seller-location data. One row represents one seller.
    columns:
      - name: seller_id
        description: Unique identifier for a seller.
        data_tests:
          - not_null
          - unique
      
      - name: seller_zip_code_prefix
        description: Five-digit ZIP-code prefix associated with the seller.
        data_tests:
          - not_null
      
      - name: seller_city
        description: City associated with the seller.
        data_tests:
          - not_null

      - name: seller_state
        description: Two letter Brazilian state code associated with the seller.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["AC", "AL", "AM", "AP", "BA", "CE", "DF", "ES", "GO", "MA", "MG", "MS", "MT", "PA", "PB", "PE", "PI", "PR", "RJ", "RN", "RO", "RR", "RS", "SC", "SE", "SP", "TO"]
  
  - name: stg_olist__orders
    description: Cleaned Olist order lifecycle data in the silver layer. One row represents one order.

    columns:
      - name: order_id
        description: Unique identifier for an order.
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: Identifier linking the order to its customer record.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__customers')
                field: customer_id
      
      - name: order_status
        description: Standardized lifecycle status of the order.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - approved
                  - canceled
                  - created
                  - delivered
                  - invoiced
                  - processing
                  - shipped
                  - unavailable
      
      - name: order_purchase_timestamp
        description: Timestamp when the customer placed the order.
        data_tests:
          - not_null
      
      - name: order_approved_at
        description: Timestamp when the payment was approved. Can be null for unapproved orders.

      - name: order_delivered_carrier_date
        description: Timestamp when the order order was handed to the carrier. Can be null for incomplete or canceled orders.

      - name: order_delivered_customer_date
        description: Timestamp when the order reached the customer. Can be null for orders not delivered.
      
      - name: order_estimated_delivery_date
        description: Estimated delivery timestamp.
        data_tests:
          - not_null





































