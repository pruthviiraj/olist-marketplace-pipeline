version: 2

sources:
  - name: olist_bronze
    description: Raw Olist e-commerce data stored in Snowflake Bronzr, loaded from files staged in Azure Data Lake.
    database: ecomm_db
    schema: bronze

    tables:
      - name: products
        description: Raw Olist product catalog. One row represents one product.
        columns:
          - name: product_id
            description: Unique identifier for a product catalog record.
            data_tests:
              - not_null
              - unique

      - name: product_category_name_translation
        description: Protuguese-to-english product-category translation mapping.
        columns:
          - name: product_category_name
            description: Portuguese product-category identifier.
            data_tests:
              - not_null
              - unique

      - name: customers
        description: Raw Olist customer and delivery-location data. One row represents a customer record associated with an order.
        columns:
          - name: customer_id
            description: Unique identifier for a customer record associated with an order.
            data_tests:
              - not_null
              - unique

          - name: customer_unique_id
            description: Identifier for the underlying customer. It can appear across multiple orders.
            data_tests:
              - not_null

          - name: customer_zip_code_prefix
            description: Customers delivery ZIP-code prefix, stored as text to preserve leading zeros.
            data_tests:
              - not_null

          - name: customer_city
            description: Customer delivery city name.
            data_tests:
              - not_null

          - name: customer_state
            description: Customer delivery state code.
            data_tests:
              - not_null

      - name: sellers
        description: Raw Olist Seller and seller-location data. One row represents one seller.
        columns:
          - name: seller_id
            description: Unique identifier for a seller.
            data_tests:
              - not_null
              - unique
          - name: seller_zip_code_prefix
            description: Five-digit ZIP-code prefix associated with the seller.
            data_tests:
              - not_null

          - name: seller_city
            description: City associated with the seller.
            data_tests:
              - not_null

          - name: seller_state
            description: Tow-letter Brazilian state code associated with the seller.
            data_tests:
              - not_null
      - name: orders
        description: Raw Olist order lifecycle data. One row represents one order. Data covers purchases from 2016-09-04 through 2018-10-17
        columns:
          - name: order_id
            description: Unique identifier for an order.
            data_tests:
              - not_null
              - unique

          - name: customer_id
            description: Identifier linking the order to its customer record.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('olist_bronze', 'customers')
                    field: customer_id

          - name: order_status
            description: Current lifecycle status of the order.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - approved
                      - canceled
                      - created
                      - delivered
                      - invoiced
                      - processing
                      - shipped
                      - unavailable

          - name: order_purchase_timestamp
            description: Timestamp when the customer placed the order.
            data_tests:
              - not_null

          - name: order_approved_at
            description: Timestamp when the payment was approved. Can be null for orders not approved.

          - name: order_delivered_carrier_date
            description: Timestamp when the order was handed to the carrier. Can be null for incomplete or canceled orders.

          - name: order_estimated_customer_date
            description: Timestamp when the order was delivered to the customer. Can be null for orders not delivered.

          - name: order_estimated_delivery_date
            description: Estimated customer delivery timestamp.
            data_tests:
              - not_null
      - name: order_items
        description: Raw olist order-line data. One row represents one item within an order.
        columns:
          - name: order_id
            description: Identifier of the order that contains the item.
            data_tests:
              - not_null

          - name: order_item_id
            description: Sequential identifier of the item within an order.
            data_tests:
              - not_null

          - name: product_id
            description: Identifier of the purchased product.
            data_tests:
              - not_null

          - name: seller_id
            description: Identifier of the seller that fulfilled the item.
            data_tests:
              - not_null

      - name: order_payments
        description: Raw Olist payment events. One row represents one payment event within an order.
        columns:
          - name: order_id
            description: Identifier of the order associated with the payment.
            data_tests:
              - not_null

          - name: payment_sequential
            description: Sequence number of the payment within the order.
            data_tests:
              - not_null

          - name: payment_value
            description: Amount paid in Brazilian reais.
            data_tests:
              - not_null

      - name: order_reviews
        description: Raw Olist customer reviews. One row represents one review associated with an order.
        columns:
          - name: review_id
            description: Review identifier. It may  appear more than once across the raw dataset.
            data_tests:
              - not_null

          - name: order_id
            description: Identifier of the order being reviewed.
            data_tests:
              - not_null

          - name: review_score
            description: Customer rating from one to five.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [1,2,3,4,5]

      - name: order_reviews_ai_enrichment_sample
        description: Sample of Olist reviews enriched with AI-generated English translations.
        columns:
          - name: review_id
            description: Raw review identifier.
            data_tests:
              - not_null

          - name: order_id
            description: Identifier of the reviewed order.
            data_tests:
              - not_null

          - name: review_score
            description: Customer rating from one to five.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [1, 2, 3, 4, 5]

          - name: english_translation
            description: AI-generated English translation of the Portuguese review message.

      - name: geolocation
        description: Raw Olist geolocation observations. Duplicate observations may exist for the same ZIP prefix.
        columns:
          - name: geolocation_zip_code_prefix
            description: ZIP-code prefix associated with the location observation.
            data_tests:
              - not_null

          - name: geolocation_lat
            description: Latitude of the location observation.
            data_tests:
              - not_null

          - name: geolocation_lng
            description: Longitude of the location observation.
            data_tests:
              - not_null

          - name: geolocation_city
            description: City associated with the location observation.
            data_tests:
              - not_null

          - name: geolocation_state
            description: State code associated with the location observation.
            data_tests:
              - not_null