version: 2

models:
  - name: mart_olist__seller_performance
    description: >
      One row per seller containing seller order, item, revenue, freight,
      delivery, and late-order metrics.

    columns:
      - name: seller_id
        description: Unique identifier for a seller.
        data_tests:
          - not_null
          - unique

      - name: seller_order_count
        description: Number of distinct orders containing items from the seller.
        data_tests:
          - not_null

      - name: seller_item_count
        description: Number of item rows sold by the seller.
        data_tests:
          - not_null

      - name: item_subtotal
        description: Sum of item prices for the seller.
        data_tests:
          - not_null

      - name: freight_total
        description: Sum of freight charges for the seller.
        data_tests:
          - not_null

      - name: delivered_order_count
        description: Number of distinct seller-associated orders that were delivered.

      - name: late_order_count
        description: Number of distinct seller-associated orders delivered after the estimate.

      - name: average_delivery_days
        description: Average delivery duration for delivered seller-associated orders.

  - name: mart_olist__customer_experience
    description: >
      One row per review-order pair containing customer feedback,
      fulfillment context, and optional AI-generated English translation.

    columns:
      - name: review_key
        description: Composite key identifying one review-order pair.
        data_tests:
          - not_null
          - unique

      - name: review_id
        description: Review identifier. It may appear more than once across orders.
        data_tests:
          - not_null

      - name: order_id
        description: Order associated with the review.
        data_tests:
          - not_null

      - name: review_score
        description: Customer review score from 1 to 5.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]

      - name: order_status
        description: Order lifecycle status associated with the review.

      - name: delivery_days
        description: Days from purchase to customer delivery. Null when not delivered.

      - name: is_late_delivery
        description: True when the reviewed order was delivered after its estimate.

      - name: english_translation
        description: Optional AI-generated English translation. Only the sampled reviews may contain a value.