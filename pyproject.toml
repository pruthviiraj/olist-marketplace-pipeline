[project]
name = "ai-ecommerce-pipeline"
version = "0.1.0"
description = "Olist Marketplace Data Pipeline for e-commerce operations analytics with AI review enrichment"
readme = "README.md"
authors = [
    { name = "Pruthvi Raj Pudi", email = "42543442+pruthviiraj@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "azure-storage-blob>=12.30.1",
    "dbt-snowflake>=1.12.0",
    "groq>=1.7.0",
    "kaggle>=2.2.4",
    "python-dotenv>=1.2.3",
]

[project.scripts]
ai-ecommerce-pipeline = "ai_ecommerce_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
